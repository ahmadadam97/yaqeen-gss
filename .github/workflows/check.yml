name: Survey checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  survey-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m venv .env
      - run: .env/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: .env/bin/python -m pip check
      - run: .env/bin/python -m unittest discover -s source -p 'test_*.py' -v
      - run: .env/bin/python source/run.py
      - name: Verify published snapshot and committed results
        run: |
          .env/bin/python - <<'PY'
          import csv, sys
          from pathlib import Path
          sys.path.insert(0, "source")
          from snapshot import current_run
          run, manifest = current_run()
          assert manifest["row_counts"]["respondents"] == 7753
          for expected in Path("report/results").glob("*.csv"):
              with expected.open(encoding="utf8") as a, (run / "results" / expected.name).open(encoding="utf8") as b:
                  assert list(csv.reader(a)) == list(csv.reader(b)), expected.name
          print("Verified", len(manifest["outputs"]), "hashed artifacts and all committed results")
          PY
